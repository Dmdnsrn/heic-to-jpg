<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEIC → JPG хөрвүүлэгч</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9deea;--accent:#2563eb;--ok:#16a34a;--err:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--line:#374151;--accent:#3b82f6;--ok:#4ade80;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
#drop{border:2px dashed var(--line);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer;transition:.15s}
#drop.over{border-color:var(--accent);background:rgba(37,99,235,.07)}
#drop b{display:block;font-size:17px;margin-bottom:4px}
#drop span{color:var(--muted);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.row label{font-size:14px;color:var(--muted)}
input[type=range]{width:160px;vertical-align:middle}
button{font:inherit;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
ul{list-style:none;margin:16px 0 0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
li:first-child{border-top:0}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.size{color:var(--muted);white-space:nowrap}
.st{min-width:110px;max-width:45%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.ok{color:var(--ok)}.st.err{color:var(--err)}.st.wait,.st.run{color:var(--muted)}
a.dl{color:var(--accent);text-decoration:none;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:16px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
footer{margin-top:18px;color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>HEIC → JPG хөрвүүлэгч</h1>
  <p class="sub">Бүх хөрвүүлэлт таны браузер дотор хийгдэнэ. Зураг серверт илгээгдэхгүй.</p>

  <div class="card">
    <div id="drop" tabindex="0">
      <b>HEIC зургуудаа энд чирж оруулна уу</b>
      <span>эсвэл дарж сонгоно уу (олон зураг зэрэг сонгож болно)</span>
    </div>
    <input id="file" type="file" accept=".heic,.heif,image/heic,image/heif" multiple hidden>

    <div class="row">
      <label>Чанар: <input id="q" type="range" min="50" max="100" value="92"> <b id="qv">92</b>%</label>
      <span class="spacer"></span>
      <button id="clear" class="sec" disabled>Цэвэрлэх</button>
      <button id="go" disabled>Хөрвүүлэх</button>
      <button id="zip" class="sec" disabled>ZIP татах</button>
    </div>

    <div class="bar" id="bar"><i id="barfill"></i></div>
    <ul id="list"></ul>
  </div>
  <footer>heic-to болон JSZip сангуудыг ашигласан</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/heic-to@1.6.6/dist/iife/heic-to.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const drop = $("drop"), input = $("file"), list = $("list"), go = $("go"),
        zipBtn = $("zip"), clearBtn = $("clear"), q = $("q"), qv = $("qv"),
        bar = $("bar"), fill = $("barfill");
  let items = [];       // {file, li, st, blob, url, name}
  let busy = false;

  q.oninput = () => qv.textContent = q.value;
  qv.textContent = q.value;

  const fmt = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const isHeic = f => /\.(heic|heif)$/i.test(f.name) || /image\/hei[cf]/i.test(f.type);

  function add(files) {
    for (const f of files) {
      if (!isHeic(f)) continue;
      if (items.some(i => i.file.name === f.name && i.file.size === f.size)) continue;
      const li = document.createElement("li");
      const name = document.createElement("span"); name.className = "name"; name.textContent = f.name; name.title = f.name;
      const size = document.createElement("span"); size.className = "size"; size.textContent = fmt(f.size);
      const st = document.createElement("span"); st.className = "st wait"; st.textContent = "Хүлээж байна";
      li.append(name, size, st);
      list.appendChild(li);
      items.push({ file: f, li, st, blob: null, url: null, name: f.name.replace(/\.(heic|heif)$/i, "") + ".jpg" });
    }
    refresh();
  }

  function refresh() {
    go.disabled = busy || !items.some(i => !i.blob);
    zipBtn.disabled = busy || !items.some(i => i.blob);
    clearBtn.disabled = busy || items.length === 0;
  }

  async function decode(file, quality) {
    // 1) heic-to (шинэ libheif) 2) боломжгүй бол браузерийн өөрийн декодер
    try {
      return await HeicTo({ blob: file, type: "image/jpeg", quality });
    } catch (e1) {
      try {
        const bmp = await createImageBitmap(file);
        const c = document.createElement("canvas");
        c.width = bmp.width; c.height = bmp.height;
        c.getContext("2d").drawImage(bmp, 0, 0);
        return await new Promise((res, rej) =>
          c.toBlob(b => b ? res(b) : rej(new Error("canvas")), "image/jpeg", quality));
      } catch (e2) {
        throw e1;
      }
    }
  }

  async function convertOne(it) {
    it.st.className = "st run"; it.st.textContent = "Хөрвүүлж байна...";
    try {
      const out = await decode(it.file, q.value / 100);
      it.blob = out;
      it.url = URL.createObjectURL(out);
      it.st.className = "st ok";
      it.st.innerHTML = "";
      const a = document.createElement("a");
      a.className = "dl"; a.href = it.url; a.download = it.name; a.textContent = "✓ Татах (" + fmt(out.size) + ")";
      it.st.appendChild(a);
    } catch (e) {
      const msg = (e && (e.message || e.code)) || String(e);
      it.st.className = "st err";
      it.st.textContent = "Алдаа: " + msg;
      it.st.title = msg;
      console.error(it.file.name, e);
    }
  }

  go.onclick = async () => {
    const todo = items.filter(i => !i.blob);
    if (!todo.length) return;
    busy = true; refresh();
    bar.style.display = "block"; fill.style.width = "0";
    let done = 0, next = 0;
    const worker = async () => {
      while (next < todo.length) {
        const it = todo[next++];
        await convertOne(it);
        fill.style.width = Math.round(++done / todo.length * 100) + "%";
      }
    };
    await Promise.all([worker(), worker()]);   // 2 зураг зэрэг
    busy = false; refresh();
    setTimeout(() => bar.style.display = "none", 800);
  };

  zipBtn.onclick = async () => {
    const ready = items.filter(i => i.blob);
    if (!ready.length) return;
    busy = true; refresh();
    zipBtn.textContent = "ZIP бэлдэж байна...";
    try {
      const zip = new JSZip(), used = {};
      for (const it of ready) {
        let n = it.name;
        if (used[n]) { used[n]++; n = n.replace(/\.jpg$/, "_" + used[n] + ".jpg"); } else used[n] = 1;
        zip.file(n, it.blob);
      }
      const blob = await zip.generateAsync({ type: "blob", compression: "STORE" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "jpg_zurag.zip";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } finally {
      zipBtn.textContent = "ZIP татах"; busy = false; refresh();
    }
  };

  clearBtn.onclick = () => {
    items.forEach(i => i.url && URL.revokeObjectURL(i.url));
    items = []; list.innerHTML = ""; refresh();
  };

  drop.onclick = () => input.click();
  drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
  input.onchange = () => { add(input.files); input.value = ""; };
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => add(e.dataTransfer.files));
})();
</script>
</body>
</html>
